      property="og:description"
      content="강화학습과 시뮬레이션으로 공급망 의사결정을 자동화하는 AI 엔지니어 포트폴리오."
    />
    <meta property="og:url" content="https://kyoungsoon-kim-portfolio.vercel.app/" />
    <script>
      // Set the theme class before first paint so the page never flashes the wrong mode.
      (() => {
        const stored = localStorage.getItem('portfolio-theme')
        const dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
